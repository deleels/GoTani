{% load static %}<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GoTani{% endblock %} · GoTani</title>
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/icons/favicon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'core/icons/apple-touch-icon.png' %}">
  <script>
    /* Theme before paint (D67): saved choice, else system. */
    (function () {
      var t = null; try { t = localStorage.getItem("gotani-theme"); } catch (e) {}
      var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  {# Tailwind Play CDN: accepted non-production compromise (D33). #}
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="{% static 'core/numbers.js' %}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="{% static 'core/gotani.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
  {% block body %}{% endblock %}
  <div id="sw-update" hidden class="no-print fixed bottom-4 left-1/2 z-[60] flex -translate-x-1/2 items-center gap-3 rounded-xl bg-stone-900 px-4 py-3 text-sm text-white shadow-lg" role="status">
    <span>Versi baru tersedia</span><button type="button" class="rounded-lg bg-emerald-500 px-3 py-1 font-medium text-white">Muat ulang</button>
  </div>
  <script src="{% static 'core/pwa.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
