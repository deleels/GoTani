{# "Satelit & Tanah" on the element detail page (D90): the same data as the map side panel, for the linked polygon. #}
<div class="mb-5 rounded-xl border border-stone-200 bg-white" x-data="elementSat('{% url 'geo:polygon_data' poly.pk %}')" x-init="load()">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-stone-200 px-4 py-3">
    <h2 class="font-semibold">Satelit &amp; Tanah <span class="text-xs font-normal text-stone-500">· {{ poly.name }}</span></h2>
    <a href="{% url 'geo:map' %}" class="text-sm text-emerald-700 underline">Buka peta</a>
  </div>
  <div class="p-4 text-sm">
    <template x-if="state === 'loading'"><p class="text-stone-500">Memuat data…</p></template>
    <template x-if="state === 'error'"><p class="text-stone-500">Tidak dapat memuat data satelit · <button type="button" class="underline" @click="load()">Coba lagi</button></p></template>
    <template x-if="state === 'ok'">
      <div class="space-y-4">
        <p x-show="d.message" class="rounded-lg border border-amber-300 px-3 py-2 text-amber-700" x-text="d.message"></p>
        <template x-if="d.satellite && d.satellite.passes.length">
          <div class="grid gap-3 sm:grid-cols-3">
            <template x-for="k in ['ndvi', 'evi', 'ndwi']" :key="k">
              <div class="rounded-lg bg-stone-50 p-3"><p class="text-xs uppercase text-stone-500" x-text="k + ' rata-rata terakhir'"></p>
                <p class="text-lg font-semibold" x-text="d.satellite.passes[0][k] ? Number(d.satellite.passes[0][k].mean).toFixed(3) : '—'"></p></div>
            </template>
          </div>
        </template>
        <template x-if="d.soil">
          <div>
            <h3 class="text-sm font-semibold">Tanah <span class="text-xs font-normal text-stone-500">· perkiraan model Open-Meteo, bukan sensor</span></h3>
            <div class="mt-2 grid gap-3 sm:grid-cols-2">
              <div class="rounded-lg bg-stone-50 p-3"><p class="text-xs text-stone-500">Suhu tanah</p>
                <template x-for="t in d.soil.temperature" :key="t.depth"><p class="flex justify-between"><span class="text-stone-500" x-text="t.depth"></span><b x-text="t.value != null ? num(t.value, 1) + ' °C' : '—'"></b></p></template></div>
              <div class="rounded-lg bg-stone-50 p-3"><p class="text-xs text-stone-500">Kelembapan tanah (volume air)</p>
                <template x-for="m in d.soil.moisture" :key="m.depth"><p class="flex justify-between"><span class="text-stone-500" x-text="m.depth"></span><b x-text="m.value != null ? num(m.value * 100, 1) + '%' : '—'"></b></p></template></div>
            </div>
          </div>
        </template>
        <p x-show="!d.soil" class="text-xs text-stone-500">Data tanah tidak tersedia saat ini.</p>
      </div>
    </template>
  </div>
</div>
<script>
  function elementSat(url) {
    return {
      state: "loading", d: null,
      async load() {
        this.state = "loading";
        try { const r = await fetch(url); if (!r.ok) throw new Error(r.status); this.d = await r.json(); this.state = "ok"; }
        catch (e) { this.state = "error"; }
      },
      num(v, p) { return Number(v).toLocaleString("id-ID", { maximumFractionDigits: p }); },
    };
  }
</script>
