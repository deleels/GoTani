{# Weather widget (D73): current + 7-day forecast + rain warning, loaded async from geo:weather. #}
<div class="rounded-xl border border-stone-200 bg-white" x-data="weatherWidget('{% url 'geo:weather' %}')" x-init="load()">
  <div class="flex items-center justify-between border-b border-stone-200 px-4 py-3"><h2 class="font-semibold">Cuaca</h2><span class="text-xs text-stone-400">Open-Meteo</span></div>
  <div class="p-4 text-sm">
    <template x-if="state === 'loading'"><p class="text-stone-500">Memuat prakiraan…</p></template>
    <template x-if="state === 'error'"><p class="text-stone-500">Tidak dapat memuat cuaca · <button type="button" class="underline" @click="load()">Coba lagi</button></p></template>
    <template x-if="state === 'empty'"><p class="text-stone-500" x-text="message"></p></template>
    <template x-if="state === 'ok'">
      <div>
        <div class="flex items-end gap-3"><p class="text-4xl font-bold" x-text="Math.round(w.current.temp) + '°'"></p>
          <div class="pb-1"><p class="font-medium" x-text="w.current.label"></p><p class="text-xs text-stone-500" x-text="'Lembap ' + (w.current.humidity ?? '—') + '% · angin ' + (w.current.wind ?? '—') + ' km/j'"></p></div></div>
        <p x-show="w.rain_warning" class="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-800" x-text="w.rain_warning"></p>
        <div class="mt-3 grid grid-cols-7 gap-1 text-center text-[11px]">
          <template x-for="d in w.days" :key="d.date">
            <div class="rounded-lg bg-stone-50 px-0.5 py-1.5" :title="d.label">
              <p class="text-stone-500" x-text="new Date(d.date).toLocaleDateString('id-ID', { weekday: 'short' })"></p>
              <p class="font-semibold" x-text="Math.round(d.tmax) + '°'"></p><p class="text-stone-400" x-text="Math.round(d.tmin) + '°'"></p>
              <p :class="d.rain_mm >= 10 ? 'text-sky-700 font-medium' : 'text-stone-400'" x-text="Math.round(d.rain_mm) + 'mm'"></p>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
<script>
  function weatherWidget(url) {
    return {
      state: "loading", w: null, message: "",
      async load() {
        this.state = "loading";
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(r.status);
          const d = await r.json();
          if (d.weather) { this.w = d.weather; this.state = "ok"; } else { this.message = "Cuaca: " + d.message + "."; this.state = "empty"; }
        } catch (e) { this.state = "error"; }
      },
    };
  }
</script>
