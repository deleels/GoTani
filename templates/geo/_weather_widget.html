{# Weather widget (D73, D89): current + spray window + 7-day forecast + rain warning, loaded async from geo:weather. Dispatches `weather-loaded` so the Cuaca page can reuse the same response. #}
{% load ui %}
<section class="gt-card app-weather" x-data="weatherWidget('{% url 'geo:weather' %}')" x-init="load()" aria-labelledby="h-weather">
  <div class="gt-card__head"><h2 class="gt-card__title" id="h-weather">Cuaca</h2>{% info_tip "Prakiraan dari Open-Meteo, diperbarui tiap jam." %}</div>
  <template x-if="state === 'loading'"><p class="gt-card__hint">Memuat prakiraan…</p></template>
  <template x-if="state === 'error'"><p class="gt-card__hint">Tidak dapat memuat cuaca · <button type="button" class="app-link" @click="load()">Coba lagi</button></p></template>
  <template x-if="state === 'empty'"><p class="gt-card__hint" x-text="message"></p></template>
  <template x-if="state === 'ok'">
    <div class="app-weather__body">
      <div class="app-weather__now">
        <span class="app-weather__temp" x-text="Math.round(w.current.temp) + '°C'"></span>
        <span><span class="app-weather__label" x-text="w.current.label"></span>
          <span class="app-row__meta" x-text="'Lembap ' + (w.current.humidity ?? '—') + '% · angin ' + (w.current.wind ?? '—') + ' km/j'"></span></span>
      </div>
      <div x-show="w.spray" class="gt-callout" :class="sprayClass(w.spray.level)">
        <div><span class="gt-callout__title" x-text="'Semprot: ' + w.spray.label"></span>
          <span class="gt-callout__body" x-text="w.spray.reasons.length ? w.spray.reasons.join(', ') : 'angin tenang, tidak ada hujan dalam 4 jam'"></span>
          <span x-show="w.spray.level !== 'GOOD'" class="gt-callout__body app-weather__next" x-text="w.next_good_spray ? 'Waktu baik berikutnya: ' + fmtHour(w.next_good_spray) : 'Belum ada waktu baik dalam 48 jam.'"></span></div>
      </div>
      <div x-show="w.rain_warning" class="gt-callout gt-callout--warning">{% icon "alert" 18 %}<span class="gt-callout__title app-weather__warn" x-text="w.rain_warning"></span></div>
      <ul class="gt-list gt-list--divided app-weather__days" aria-label="Prakiraan 7 hari">
        <template x-for="d in w.days" :key="d.date">
          <li class="gt-row app-weather__day">
            <span class="gt-row__body"><span class="gt-row__title" x-text="new Date(d.date + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long' })"></span><span class="app-row__meta" x-text="d.label"></span></span>
            <span class="gt-row__trail"><span class="app-weather__rain" :class="d.rain_mm >= 10 && 'app-weather__rain--wet'" x-text="Math.round(d.rain_mm) + ' mm'"></span>
              <span class="gt-row__value" x-text="Math.round(d.tmax) + '° / ' + Math.round(d.tmin) + '°C'"></span></span>
          </li>
        </template>
      </ul>
    </div>
  </template>
</section>
<script>
  function weatherWidget(url) {
    return {
      state: "loading", w: null, message: "",
      async load() {
        this.state = "loading";
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(r.status);
          const d = await r.json();
          if (d.weather) { this.w = d.weather; this.state = "ok"; } else { this.message = "Cuaca: " + d.message + "."; this.state = "empty"; }
          window.dispatchEvent(new CustomEvent("weather-loaded", { detail: d }));
        } catch (e) { this.state = "error"; window.dispatchEvent(new CustomEvent("weather-loaded", { detail: null })); }
      },
      sprayClass(level) {
        return level === "GOOD" ? "gt-callout--success" : level === "FAIR" ? "gt-callout--warning" : "gt-callout--danger";
      },
      fmtHour(t) { const d = new Date(t); return d.toLocaleDateString("id-ID", { weekday: "short" }) + " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }); },
    };
  }
</script>
