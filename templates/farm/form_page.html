{% extends "farm/_layout.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="max-w-xl rounded-lg border bg-white p-5">
  <h1 class="mb-4 text-lg font-semibold">{{ page_title }}</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="mt-4 rounded bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">Simpan</button>
  </form>
</div>
{% endblock %}
