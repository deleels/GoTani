{% load i18n %}{% load ui %}{# "Atur kolom" menu (D68). Parent needs x-data="columns('key', ['Label', ...])"; cells carry :class="hidden('Label')". #}
<div class="relative" x-data="{ open: false }" @click.outside="open=false" @keydown.escape="open=false">
  <button type="button" @click="open=!open" class="gt-btn gt-btn--outline gt-btn--sm" :aria-expanded="open">{% translate "Atur kolom" %} {% icon "chevron" 16 %}</button>
  <div x-show="open" x-cloak class="app-menu app-menu--cols">
    <template x-for="c in cols" :key="c">
      <label class="gt-check app-menu__check"><input type="checkbox" :checked="!off.includes(c)" @change="toggle(c)"><span class="gt-check__title" x-text="c"></span></label>
    </template>
  </div>
</div>
