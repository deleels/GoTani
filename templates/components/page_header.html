{# Page head (D68): include with title= subtitle= and optionally actions= (rendered HTML, e.g. from {% with %} or a context var). #}
<div class="gt-pagehead app-pagehead--sm">
  <div class="app-pagehead__text">
    <h1>{{ title }}</h1>
    {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions %}<div class="gt-pagehead__actions">{{ actions }}</div>{% endif %}
</div>
