{% load ui %}{% if messages %}
<div class="no-print app-messages" role="status">
  {% for message in messages %}
  <div class="gt-callout{% if message.tags == 'success' %} gt-callout--success{% elif message.tags == 'warning' %} gt-callout--warning{% elif message.tags == 'error' %} gt-callout--danger{% endif %}">
    {% if message.tags == 'error' or message.tags == 'warning' %}{% icon "alert" 18 %}{% elif message.tags == 'success' %}{% icon "check" 18 %}{% else %}{% icon "info" 18 %}{% endif %}
    <span class="gt-callout__title">{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
