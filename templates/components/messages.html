{% if messages %}
<div class="no-print mb-4 space-y-2">
  {% for message in messages %}
  <div class="rounded-lg border px-4 py-2 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
