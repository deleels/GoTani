{# Status tabs synced to ?tab= (D68). Needs `tabs` [(key, label)] and `tab`. Extra query: `extra`. Links, so no role="tab". #}
<nav class="gt-tabs" aria-label="{{ tabs_label|default:'Status' }}">
  {% for key, label in tabs %}
  <a href="?tab={{ key }}{% if extra %}&{{ extra }}{% endif %}" class="gt-tab app-tab{% if tab == key %} gt-tab--active{% endif %}"{% if tab == key %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
