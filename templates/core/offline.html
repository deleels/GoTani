<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <title>Offline · GoTani</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafaf9; --card: #fff; --ink: #1c1917; --muted: #78716c; --brand: #059669; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0f0d; --card: #151a17; --ink: #e7ece9; --muted: #8f9a93; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; background: var(--card); border-radius: 16px; padding: 32px 28px; text-align: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--brand); display: grid; place-items: center; margin: 0 auto 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; font-size: .95rem; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.2-6.1C9.6 14.4 12 13 13 12"/></svg></div>
    <h1>Anda sedang offline</h1>
    <p>{{ farm_name|default:"GoTani" }} membutuhkan koneksi internet. Data tidak disimpan saat offline agar stok dan kas tetap akurat — sambungkan kembali lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
