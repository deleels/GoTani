<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#175738">
  <title>Offline · GoTani</title>
  <style>
    /* Self-contained (served from the service-worker cache): design-system token values inlined (Phase 5b). */
    :root { --surface: #f7f7f7; --raised: #fff; --ink: #000; --muted: #737373; --brand: #175738; --tint: #edf6ee; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--surface); color: var(--ink);
           font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; background: var(--raised); border-radius: 20px; padding: 32px 28px; text-align: center; }
    .logo { width: 56px; height: 56px; border-radius: 999px; background: var(--tint); display: grid; place-items: center; margin: 0 auto 16px; }
    h1 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 22px; margin: 0 0 24px; font-size: 15px; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 0 20px; height: 44px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
    button:hover { background: #13452d; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#175738" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.2-6.1C9.6 14.4 12 13 13 12"/></svg></div>
    <h1>Anda sedang offline</h1>
    <p>{{ farm_name|default:"GoTani" }} membutuhkan koneksi internet. Data tidak disimpan saat offline agar stok dan kas tetap akurat — sambungkan kembali lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
